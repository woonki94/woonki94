<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    /* loopText off: text/decorations render statically. */
    .underline { transform-origin: left center; }
  </style>
  <defs>
    <linearGradient id="hdr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#101a2e" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#hdr-bg)" rx="14" ry="14"/>

  
    <g fill="none" stroke="#72aaff" stroke-opacity="0.08">
      <circle cx="770" cy="280" r="150"/><circle cx="770" cy="280" r="110"/>
      <circle cx="30" cy="40" r="130"/>
    </g>
    <text x="400" y="57" text-anchor="middle" fill="#72aaff" font-family="ui-monospace,monospace" font-size="10" letter-spacing="3">APPLIED AI / RESEARCH PORTFOLIO</text>
    <g font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">
      <rect x="150" y="232" width="160" height="27" rx="13.5" fill="#72aaff" fill-opacity="0.09" stroke="#72aaff" stroke-opacity="0.25"/><text x="230" y="250" fill="#b5c4db">MULTI-AGENT</text><rect x="320" y="232" width="160" height="27" rx="13.5" fill="#72aaff" fill-opacity="0.09" stroke="#72aaff" stroke-opacity="0.25"/><text x="400" y="250" fill="#b5c4db">MODEL PRIVACY</text><rect x="490" y="232" width="160" height="27" rx="13.5" fill="#72aaff" fill-opacity="0.09" stroke="#72aaff" stroke-opacity="0.25"/><text x="570" y="250" fill="#b5c4db">OPTIMIZATION</text>
    </g>
<!-- Corner decorations: outer <g> = position, inner <g> = animation -->
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#72aaff" />
    <rect x="40" y="42" width="2" height="22" fill="#72aaff" />
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#72aaff" />
      <rect x="40" y="42" width="2" height="22" fill="#72aaff" />
    </g>
  </g>

  <!-- Name -->
  <text class="name" x="400" y="138" text-anchor="middle" fill="#f3f6fc" font-family='"Inter", system-ui, sans-serif' font-size="56" font-weight="700" letter-spacing="-1.5">Kim Woonki</text>

  <!-- Accent underline -->
  <rect class="underline" x="260" y="164" width="280" height="2" fill="#72aaff" rx="1"/>

  <!-- Meta line -->
  <text class="meta" x="400" y="200" text-anchor="middle" fill="#b5c4db" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">M.S. IN AI   ·   OREGON STATE UNIVERSITY</text>
</svg>