<svg xmlns="http://www.w3.org/2000/svg" width="400" height="291" viewBox="0 0 400 291"><rect x="0.5" y="0.5" width="399" height="290" rx="14" fill="#101a2e" stroke="#2b3b55"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><path d="M16 28V261" stroke="#72aaff" stroke-width="3"/><text x="30" y="51" fill="#f3f6fc" font-size="25" font-weight="700" letter-spacing="-0.5">Research &amp; engineering.</text><g fill="#b5c4db" font-size="18"><text x="30" y="94">I build multi-agent retrieval and</text><text x="30" y="119">recommendation systems and study how</text><text x="30" y="144">language models memorize training</text><text x="30" y="169">data. My projects span grant</text><text x="30" y="194">discovery, privacy-preserving</text><text x="30" y="219">training, numerical optimization,</text><text x="30" y="244">and computer vision.</text></g></g></svg>